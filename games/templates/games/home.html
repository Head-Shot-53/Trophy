{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto px-4 py-8">

    <!-- Заголовок -->
    <h1 class="text-4xl font-bold text-center mb-8">PlatinumQuest – Відкрий усі трофеї!</h1>

    <!-- Пошук та фільтри -->
    <div class="flex flex-col md:flex-row justify-between mb-6 gap-4">
        <input type="text" id="search" placeholder="Пошук ігор..." class="w-full md:w-1/3 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        
        <select id="filter-platform" class="w-full md:w-1/6 p-2 border rounded-lg">
            <option value="">Всі платформи</option>
            <option value="PC">PC</option>
            <option value="PS5">PS5</option>
            <option value="PS4">PS4</option>
            <option value="XBOX">XBOX</option>
            <option value="SWITCH">Switch</option>
        </select>

        <select id="filter-genre" class="w-full md:w-1/6 p-2 border rounded-lg">
            <option value="">Всі жанри</option>
            {% for genre in genres %}
            <option value="{{ genre }}">{{ genre }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Список ігор -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        {% for game in games %}
        <div class="bg-gray-800 rounded-lg overflow-hidden shadow-lg hover:shadow-2xl transition duration-300">
            
            <!-- Обкладинка гри -->
            <img src="{{ game.image.url }}" alt="{{ game.title }}" class="w-full h-48 object-cover">

            <!-- Інформація про гру -->
            <div class="p-4">
                <h2 class="text-xl font-semibold text-white">{{ game.title }}</h2>
                <p class="text-gray-400 text-sm">{{ game.genre }} | {{ game.get_platform_display }}</p>

                <!-- Кнопка деталі -->
                <a href="{% url 'games:game_detail' game.slug %}" class="mt-3 inline-block bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">Детальніше</a>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

<!-- Скрипт для фільтрування / пошуку -->
<script>
    const searchInput = document.getElementById('search');
    const platformSelect = document.getElementById('filter-platform');
    const genreSelect = document.getElementById('filter-genre');

    function filterGames() {
        const search = searchInput.value.toLowerCase();
        const platform = platformSelect.value;
        const genre = genreSelect.value;

        document.querySelectorAll('.grid > div').forEach(card => {
            const title = card.querySelector('h2').innerText.toLowerCase();
            const cardInfo = card.querySelector('p').innerText;

            if ((title.includes(search)) &&
                (platform === "" || cardInfo.includes(platform)) &&
                (genre === "" || cardInfo.includes(genre))) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    searchInput.addEventListener('input', filterGames);
    platformSelect.addEventListener('change', filterGames);
    genreSelect.addEventListener('change', filterGames);
</script>

{% endblock %}
